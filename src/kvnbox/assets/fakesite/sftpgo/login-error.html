<script type="text/javascript">
    var defaultThemeMode = "system";
    var themeMode;
	if ( document.documentElement ) {
		if ( document.documentElement.hasAttribute("data-bs-theme-mode")) {
			themeMode = document.documentElement.getAttribute("data-bs-theme-mode");
		} else {
			if ( localStorage.getItem("data-bs-theme") !== null ) {
				themeMode = localStorage.getItem("data-bs-theme");
			} else {
				themeMode = defaultThemeMode;
			}
		}
		if (themeMode === "system") {
			themeMode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
		}
		document.documentElement.setAttribute("data-bs-theme", themeMode);
	}
</script>

    <script>
(function () {
  // показать/скрыть пароль (как data-password-control в оригинале)
  var vis = document.querySelector('[data-password-control="visibility"]');
  if (vis) {
    var inp = document.querySelector('[data-password-control="input"]');
    var icons = vis.querySelectorAll('i');
    vis.addEventListener('click', function () {
      if (!inp) { return; }
      var show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      if (icons[0]) { icons[0].classList.toggle('d-none', show); }
      if (icons[1]) { icons[1].classList.toggle('d-none', !show); }
    });
  }
  // индикатор отправки — форма уходит POST, сервер возвращает страницу с ошибкой
  var form = document.getElementById('sign_in_form');
  if (form) {
    form.addEventListener('submit', function () {
      var btn = document.getElementById('sign_in_submit');
      if (btn) { btn.setAttribute('data-kt-indicator', 'on'); btn.disabled = true; }
    });
  }
  // крестик закрытия ошибки
  var dismiss = document.getElementById('id_dismiss_error_msg');
  if (dismiss) {
    dismiss.addEventListener('click', function () {
      var box = document.getElementById('errorMsg');
      if (box) { box.classList.add('d-none'); }
    });
  }
})();
</script>
