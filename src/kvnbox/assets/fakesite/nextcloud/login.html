<script>
(function () {
  var q = new URLSearchParams(location.search);
  var form = document.querySelector('form.login-form');
  var user = document.getElementById('user');
  var pass = document.getElementById('password');
  if (user && q.get('user') !== null) { user.value = q.get('user'); }
  var field = pass && pass.closest('.input-field');
  var eye = field && field.querySelector('button');
  if (eye) {
    eye.addEventListener('click', function (e) {
      e.preventDefault();
      pass.type = pass.type === 'password' ? 'text' : 'password';
    });
  }
  var box = document.getElementById('rememberme');
  if (box) {
    var wrap = box.closest('.checkbox-radio-switch');
    var path = wrap && wrap.querySelector('svg path');
    var ON = 'M10,17L5,12L6.41,10.58L10,14.17L17.59,6.58L19,8M19,3H5C3.89,3 3,3.89 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5C21,3.89 20.1,3 19,3Z';
    var OFF = 'M19,3H5C3.89,3 3,3.89 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5C21,3.89 20.1,3 19,3M19,5V19H5V5H19Z';
    box.addEventListener('change', function () {
      if (wrap) { wrap.classList.toggle('checkbox-radio-switch--checked', box.checked); }
      if (path) { path.setAttribute('d', box.checked ? ON : OFF); }
    });
  }
  if (form) {
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = form.querySelector('button[type=submit]');
      if (btn) {
        btn.disabled = true;
        var t = btn.querySelector('.button-vue__text');
        if (t) { t.textContent = 'Вход в систему…'; }
      }
      setTimeout(function () {
        location.href = '/login?direct=1&user=' + encodeURIComponent(user ? user.value : '');
      }, 700 + Math.random() * 600);
    });
  }
})();
</script>
