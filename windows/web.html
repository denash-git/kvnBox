<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kvnBox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 6 56 19 32 32 8 19Z' fill='%2322c55e'/%3E%3Cpath d='M8 19 32 32v26L8 45Z' fill='%23ef4444'/%3E%3Cpath d='M56 19 32 32v26l24-13Z' fill='%233b82f6'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b1020;--bg2:#0f1629;--card:#131c33;--card2:#18233f;--line:#22304f;--line2:#2c3c60;
  --text:#e7ecf5;--text2:#a7b2c8;--dim:#6f7c96;
  --blue:#3b82f6;--blue2:#2563eb;--green:#22c55e;--red:#ef4444;--yellow:#eab308;--violet:#8b5cf6;--cyan:#06b6d4;--orange:#f97316;
  --accent:var(--blue);--shadow:0 10px 30px rgba(0,0,0,.35);--r:12px;--r2:8px;
}
[data-theme=light]{
  --bg:#f3f5f9;--bg2:#ffffff;--card:#ffffff;--card2:#f6f8fc;--line:#e3e8f1;--line2:#d5dce8;
  --text:#0f172a;--text2:#475569;--dim:#8a96ab;--shadow:0 10px 30px rgba(15,23,42,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}

/* ── боковая панель ── */
aside{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px}
.brand b{font-size:17px;letter-spacing:.2px}.brand small{color:var(--dim);display:block;font-size:11px;margin-top:-2px}
.srv{position:relative}
.srv-btn{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);cursor:pointer;text-align:left}
.srv-btn:hover{border-color:var(--line2)}
.srv-btn .t{flex:1;min-width:0}.srv-btn .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.srv-btn .t span{color:var(--dim);font-size:12px}
.srv-menu{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line2);border-radius:var(--r2);box-shadow:var(--shadow);padding:6px;display:none;z-index:30}
.srv-menu.open{display:block}
.srv-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer}.srv-item:hover{background:var(--card2)}
.srv-item small{color:var(--dim);margin-left:auto;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none;display:inline-block}
.dot.ok{background:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.15)}.dot.bad{background:var(--red);box-shadow:0 0 0 3px rgba(239,68,68,.15)}.dot.warn{background:var(--yellow)}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--r2);color:var(--text2);text-decoration:none;cursor:pointer;position:relative}
nav a:hover{background:var(--card);color:var(--text)}
nav a.on{background:linear-gradient(90deg,rgba(59,130,246,.18),rgba(59,130,246,.04));color:var(--text)}
nav a.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--blue)}
nav a .cnt{margin-left:auto;font-size:11px;background:var(--card2);border:1px solid var(--line);padding:0 7px;border-radius:10px;color:var(--text2)}
.aside-foot{margin-top:auto;display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12px;padding:0 6px}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:var(--r2);border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--text2)}
.icon-btn:hover{color:var(--text);border-color:var(--line2)}
.icon-btn.sm{width:30px;height:30px}

/* ── основная часть ── */
main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:18px 32px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20}
.top h1{margin:0;font-size:20px;font-weight:600}.top .sub{color:var(--dim);font-size:13px}
.top .sp{flex:1}
.conn{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:20px}
.page{padding:26px 32px 60px;display:grid;gap:22px;max-width:1280px;width:100%}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:var(--r2);border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--line2);background:var(--card2)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue2)}
.btn.danger{color:var(--red)}.btn.danger:hover{border-color:var(--red)}
.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:var(--card2)}
.btn[disabled]{opacity:.6;pointer-events:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card h3{margin:0 0 4px;font-size:15px;font-weight:600}.card .muted{color:var(--dim);font-size:13px}
.row{display:flex;align-items:center;gap:12px}.row .sp{flex:1}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.kpi{display:flex;flex-direction:column;gap:10px}
.kpi .lbl{display:flex;align-items:center;gap:8px;color:var(--text2);font-size:13px}
.kpi .ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.kpi .val{font-size:26px;font-weight:650;letter-spacing:-.3px}.kpi .val small{font-size:13px;color:var(--dim);font-weight:500;margin-left:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:20px;border:1px solid var(--line);color:var(--text2);background:var(--card2)}
.pill.ok{color:var(--green);border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.08)}
.pill.bad{color:var(--red);border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.08)}
.pill.warn{color:var(--yellow);border-color:rgba(234,179,8,.35);background:rgba(234,179,8,.08)}
.pill.info{color:var(--blue);border-color:rgba(59,130,246,.35);background:rgba(59,130,246,.08)}
.bar{height:8px;border-radius:6px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.res{display:grid;gap:14px}.res .r{display:grid;gap:6px}.res .r .row{font-size:13px}.res .r .row b{font-weight:600}
.list{display:grid}
.li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line)}.li:first-child{border-top:0}
.li .t{flex:1;min-width:0}.li .t b{font-weight:550}.li .t small{display:block;color:var(--dim);font-size:12px}

/* ── пользователи ── */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:0 12px;height:38px;min-width:260px;color:var(--dim)}
.search input{border:0;outline:0;background:transparent;height:100%;flex:1;color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:20px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:12.5px;color:var(--text2)}
.chip.on{border-color:var(--blue);color:var(--text);background:rgba(59,130,246,.14)}
table{width:100%;border-collapse:separate;border-spacing:0}
.tbl{padding:0;overflow:hidden}
th{font-weight:500;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:12px 18px;background:var(--card2);border-bottom:1px solid var(--line)}
td{padding:12px 18px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer;transition:background .12s}tbody tr:hover{background:var(--card2)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:650;color:#fff;font-size:13px;flex:none}
.uname{display:flex;align-items:center;gap:12px}.uname small{display:block;color:var(--dim);font-size:12px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:500;margin:2px 4px 2px 0;border:1px solid}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.off{opacity:.45;text-decoration:line-through}
.sw{position:relative;width:38px;height:22px;border-radius:12px;background:var(--line2);border:0;cursor:pointer;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--green)}.sw.on::after{left:19px}
.acts{display:flex;gap:6px;justify-content:flex-end}

/* ── выдвижная панель и окна ── */
.scrim{position:fixed;inset:0;background:rgba(3,7,18,.55);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg2);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(100%);transition:transform .25s ease;z-index:50;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dh{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.db{padding:18px 22px;overflow:auto;display:grid;gap:16px;align-content:start}
.sect{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin:6px 0 -6px}
.conn-card{border:1px solid var(--line);border-radius:var(--r2);background:var(--card);padding:12px 14px;display:grid;gap:8px}
.conn-card code{font:12px/1.4 "Cascadia Mono",Consolas,monospace;color:var(--text2);background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;word-break:break-all;max-height:56px;overflow:hidden}
.qrbox{display:grid;place-items:center;padding:16px;background:#fff;border-radius:var(--r2);margin-top:4px}
.qrbox canvas{width:220px;height:220px;image-rendering:pixelated}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;width:min(620px,calc(100% - 32px));background:var(--bg2);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);transition:all .2s;z-index:60}
.modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.mh{display:flex;align-items:center;padding:18px 22px 6px}.mh h2{margin:0;font-size:18px}.mb{padding:10px 22px 4px;display:grid;gap:16px}.mf{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px 20px}
label.f{display:grid;gap:6px;font-size:13px;color:var(--text2)}
.input{height:40px;border-radius:var(--r2);border:1px solid var(--line);background:var(--card);padding:0 12px;outline:0;color:var(--text)}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.18)}
.protos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pc{border:1px solid var(--line);border-radius:var(--r2);padding:11px 12px;cursor:pointer;background:var(--card);display:flex;gap:10px;align-items:flex-start}
.pc:hover{border-color:var(--line2)}.pc.on{border-color:var(--blue);background:rgba(59,130,246,.1)}
.pc b{display:block;font-weight:600;font-size:13.5px}.pc small{color:var(--dim);font-size:12px;line-height:1.35;display:block}
.pc .pi{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:none;color:#fff;font-size:11px;font-weight:700}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:var(--r2);padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:6px;cursor:pointer;color:var(--text2)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.2)}

/* ── модули, настройки, журналы ── */
.mod{display:grid;gap:14px}
.mod .head{display:flex;align-items:center;gap:12px}
.mod .lg{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.mod .meta{display:flex;gap:16px;color:var(--dim);font-size:12.5px;flex-wrap:wrap}.mod .meta b{color:var(--text2);font-weight:550}
.mod .foot{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:2px}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tpl{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;cursor:pointer;background:var(--card)}
.tpl.on{border-color:var(--blue);box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.tpl .pv{height:84px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:13px}
.tpl div:last-child{padding:8px 10px;font-size:12.5px;display:flex;align-items:center;justify-content:space-between}
.form{display:grid;gap:14px;max-width:560px}
.term{background:#070b16;border:1px solid var(--line);border-radius:var(--r);font:12.5px/1.6 "Cascadia Mono",Consolas,monospace;color:#c8d3e6;padding:14px 16px;height:460px;overflow:auto}
[data-theme=light] .term{background:#0b1020}
.term .ts{color:#5c6b88}.term .w{color:#eab308}.term .e{color:#f87171}.term .ok{color:#4ade80}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-color:var(--blue)}
.empty{display:grid;place-items:center;text-align:center;padding:50px 20px;color:var(--dim);gap:8px}

/* ── уведомления, загрузка ── */
#toasts{position:fixed;right:22px;bottom:22px;display:grid;gap:10px;z-index:80}
.toast{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:11px 14px;box-shadow:var(--shadow);min-width:280px;animation:tin .2s ease}
.toast .ti{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.sk{border-radius:6px;background:linear-gradient(90deg,var(--card2),var(--line),var(--card2));background-size:200% 100%;animation:sk 1.2s infinite linear}
@keyframes sk{to{background-position:-200% 0}}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── узкий экран ── */
.burger{display:none}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;bottom:0;width:270px;transform:translateX(-100%);transition:transform .25s;z-index:45;box-shadow:var(--shadow)}
  aside.open{transform:none}
  .burger{display:inline-grid}
  .top{padding:14px 16px}.page{padding:18px 16px 50px}
  .g4,.g3,.g2,.protos{grid-template-columns:1fr}
  .hide-m{display:none}
  .search{min-width:0;flex:1}
  td,th{padding:10px 12px}
}

.themew{position:relative;display:inline-flex}
.theme-pop{position:absolute;right:0;top:calc(100% + 8px);width:232px;background:var(--card);border:1px solid var(--line2);border-radius:var(--r2);box-shadow:var(--shadow);padding:12px;display:none;z-index:40}
.theme-pop.open{display:block}
.theme-pop .tl{font-size:12px;color:var(--dim);margin:0 2px 8px}
.thm{display:flex;gap:10px;margin:0 2px 14px}
.thm button{width:44px;height:44px;border:2px solid transparent;border-radius:10px;background:none;padding:2px;cursor:pointer}
.thm button:hover{border-color:var(--line2)}
.thm button.on{border-color:var(--blue)}
.thm i{display:block;width:100%;height:100%;border-radius:7px;border:1px solid rgba(127,127,127,.35)}
.thm-sl{display:flex;align-items:center;gap:8px;color:var(--dim)}
.thm-sl input{flex:1;accent-color:var(--blue)}
.thm-sl .rs{border:0;background:none;color:var(--dim);cursor:pointer;padding:2px;display:grid;place-items:center}.thm-sl .rs svg.i{width:16px;height:16px}.thm-sl .rs:hover{color:var(--text)}
[data-theme=gray]{--text:#eef0f3;--text2:#c5cad2;--dim:#979ea9;--shadow:0 10px 30px rgba(0,0,0,.25)}
[data-theme=gray] .term{background:#1d1f23}
.nw{white-space:nowrap}.mono{font-family:"Cascadia Mono",Consolas,monospace}
.row.wrap{flex-wrap:wrap}.hint{color:var(--dim);font-size:12px}
.btn.red{background:var(--red);border-color:var(--red)}.btn.red:hover{background:#dc2626}
.btn.ghost.danger{color:var(--red)}
.kico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.banner{display:flex;align-items:center;gap:14px;border-color:rgba(234,179,8,.35);background:linear-gradient(90deg,rgba(234,179,8,.08),transparent)}
.spin.dark{border-color:rgba(127,127,127,.35);border-top-color:var(--blue)}
.term.small{height:auto;max-height:300px;font-size:12px}
.pc.dis{opacity:.45;cursor:not-allowed}
.icon-btn sup{font-size:8px;margin-left:-2px}
.srv-hint{padding:8px 10px;color:var(--dim);font-size:12px;border-top:1px solid var(--line);margin-top:4px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.paths .li{gap:10px}.paths .input{flex:1}
.peers{margin-top:-4px;max-height:180px;overflow:auto}
.bans{max-height:420px;overflow:auto}
textarea.input.ta{height:110px;padding:10px 12px;resize:vertical;font:12px "Cascadia Mono",Consolas,monospace}
.tabs{padding:0 14px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}.tabs button{white-space:nowrap}
.qrbox svg{width:240px;height:240px;display:block}
.conn-card code{max-height:none;max-height:76px;overflow:auto}
.mod .foot{flex-wrap:wrap}.mod{min-width:0}.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.uname small{white-space:nowrap}
.srv-btn .t .addr{display:flex;align-items:center;gap:14px;color:var(--dim);font-size:12px;white-space:nowrap}
.srv-btn .t .addr .ms{display:inline-flex;align-items:center;gap:3px}.srv-btn .t .addr .ms .i{width:12px;height:12px;color:var(--yellow)}
.srv-menu{right:auto;width:max(100%,290px)}
.srv-item{align-items:flex-start}.srv-item .dot{margin-top:6px}.srv-item .st{display:grid;min-width:0;flex:1}
.srv-item .st b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.srv-item .st small{margin:0;color:var(--dim);font-size:12px}
.srv-item.cur{background:rgba(59,130,246,.12)}.srv-item .ck{color:var(--blue)}
.chips.sm .chip{padding:3px 9px;font-size:11.5px}
.chip.p{display:inline-flex;align-items:center;gap:5px}.chip.p i{width:6px;height:6px;border-radius:50%;background:currentColor}
.drawer{width:min(780px,100%)}
.dact{display:flex;gap:8px;flex-wrap:wrap;padding:12px 22px;border-bottom:1px solid var(--line)}
.page.ov{gap:14px;padding-top:18px}
.ov .card{padding:14px 18px}.ov .kpi{gap:6px}.ov .kpi .val{font-size:22px}
.ov .li{padding:7px 2px}.ov .res{gap:10px}
.strip{display:flex;align-items:center;gap:12px;padding:10px 16px!important;flex-wrap:wrap}
.strip.warn{border-color:rgba(234,179,8,.35);background:linear-gradient(90deg,rgba(234,179,8,.08),transparent)}

<script>
/* kvnBox — веб-меню. Страницу отдаёт лаунчер (127.0.0.1), запросы идут в PowerShell,
   оттуда — по постоянному SSH-каналу в `kvnbox api serve` на выбранном сервере. */
'use strict';
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const ic = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PROTOS = {
  'vless-ws': {n:'VLESS WS', c:'#3b82f6', d:'WebSocket через сайт-маскировку'},
  'vless-grpc': {n:'VLESS gRPC', c:'#6366f1', d:'gRPC, хорошо держит мобильные сети'},
  'vless-httpupgrade': {n:'VLESS HTTPUpgrade', c:'#0ea5e9', d:'Лёгкий HTTP Upgrade'},
  'vless-xhttp': {n:'VLESS XHTTP', c:'#8b5cf6', d:'XHTTP, только Xray'},
  'vless-cdn': {n:'VLESS CDN', c:'#06b6d4', d:'Через CDN, IP сервера скрыт'},
  'naive': {n:'NaiveProxy', c:'#f97316', d:'HTTPS как у браузера Chrome'},
  'mieru': {n:'Mieru', c:'#eab308', d:'Свой протокол, отдельный порт'},
  'awg': {n:'AmneziaWG', c:'#22c55e', d:'WireGuard с маскировкой 3.1'},
};
const AVC = ['#3b82f6','#8b5cf6','#06b6d4','#f97316','#22c55e','#ef4444','#eab308','#6366f1'];
const avc = n => AVC[[...n].reduce((a, c) => a + c.charCodeAt(0), 0) % AVC.length];
const badge = (p, on = true) => { const v = PROTOS[p] || {n:p, c:'#64748b'};
  return `<span class="badge ${on ? '' : 'off'}" style="color:${v.c};border-color:${v.c}55;background:${v.c}14"><i></i>${esc(v.n)}</span>`; };
const stateText = s => s === 'active' ? 'работает' : s === 'not_installed' ? 'не установлен' : s === 'inactive' ? 'остановлен' : s === 'failed' ? 'ошибка' : s;
const stateCls = s => s === 'active' ? 'ok' : s === 'not_installed' || s === 'inactive' ? '' : 'bad';
const fmtBytes = b => b > 1e9 ? (b / 1e9).toFixed(1) + ' ГБ' : b > 1e6 ? (b / 1e6).toFixed(1) + ' МБ' : Math.round(b / 1e3) + ' КБ';

/* ═══ связь с лаунчером ═══ */
let SERVERS = [], SRV = localStorage.getItem('kvn-srv') || '', SEQ = 0, LAUNCHER = '';
const LINE = new Map();
function call(action, args = {}, onLine) {
  const id = 'w' + (++SEQ) + '-' + Date.now().toString(36);
  if (onLine) LINE.set(id, onLine);
  const promise = fetch(`/app/call?t=${TOKEN}&s=${encodeURIComponent(SRV)}`, {method:'POST', body: JSON.stringify({id, action, args})})
    .then(r => r.json())
    .then(j => { if (!j.ok) throw new Error(j.error || 'Ошибка'); return j.data; })
    .finally(() => LINE.delete(id));
  return {id, promise};
}
const api = (action, args, onLine) => call(action, args, onLine).promise;
function events() {
  const es = new EventSource(`/app/events?t=${TOKEN}`);
  es.onmessage = e => { try { const {m} = JSON.parse(e.data); const h = LINE.get(m.id); if (h) h(m.data); } catch (_) {} };
  es.onerror = () => { es.close(); setTimeout(events, 2000); };
}

/* ═══ интерфейс: уведомления, окна ═══ */
function toast(text, kind = 'ok') {
  const t = document.createElement('div'); t.className = 'toast';
  const col = kind === 'ok' ? 'var(--green)' : kind === 'bad' ? 'var(--red)' : 'var(--blue)';
  t.innerHTML = `<span class="ti" style="background:${col}22;color:${col}">${ic(kind === 'ok' ? 'check' : kind === 'bad' ? 'alert' : 'refresh')}</span><span>${esc(text)}</span>`;
  $('#toasts').append(t); setTimeout(() => t.remove(), kind === 'bad' ? 9000 : 4000);
}
function openModal(html) { $('#modal').classList.remove('wide'); $('#modal').innerHTML = html; $('#modal').classList.add('open'); $('#scrim').classList.add('open'); }
function closeAll() { ['#drawer', '#modal', '#scrim'].forEach(s => $(s).classList.remove('open')); }
$('#scrim').onclick = () => { if (!$('#modal').dataset.locked) closeAll(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').dataset.locked) closeAll(); });
/* подтверждение поверх открытого окна (не закрывает его) */
const confirmBox2 = (title, text) => Promise.resolve(window.confirm(`${title}\n\n${text}`));
function confirmBox(title, text, okText = 'Да', danger = false) {
  return new Promise(res => {
    openModal(`<div class="mh"><h2>${esc(title)}</h2></div><div class="mb"><div style="color:var(--text2);white-space:pre-line">${text}</div></div>
      <div class="mf"><button class="btn" id="mno">Отмена</button><button class="btn primary ${danger ? 'red' : ''}" id="myes">${esc(okText)}</button></div>`);
    $('#mno').onclick = () => { closeAll(); res(false); };
    $('#myes').onclick = () => { closeAll(); res(true); };
  });
}
function formBox(title, fields, okText = 'Сохранить', note = '') {
  return new Promise(res => {
    openModal(`<div class="mh"><h2>${esc(title)}</h2><span style="flex:1"></span><button class="icon-btn" id="mx">${ic('x')}</button></div>
      <div class="mb">${note ? `<div style="color:var(--text2);font-size:13px">${note}</div>` : ''}${fields.map((f, i) => f.type === 'textarea'
        ? `<label class="f">${esc(f.label)}<textarea class="input ta" id="mf${i}" placeholder="${esc(f.ph || '')}">${esc(f.value || '')}</textarea></label>`
        : `<label class="f">${esc(f.label)}<input class="input" id="mf${i}" type="${f.type || 'text'}" value="${esc(f.value ?? '')}" placeholder="${esc(f.ph || '')}">${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ''}</label>`).join('')}</div>
      <div class="mf"><button class="btn" id="mno">Отмена</button><button class="btn primary" id="myes">${esc(okText)}</button></div>`);
    const done = v => { closeAll(); res(v); };
    $('#mx').onclick = $('#mno').onclick = () => done(null);
    $('#myes').onclick = () => done(fields.map((_, i) => $('#mf' + i).value.trim()));
    setTimeout(() => $('#mf0')?.focus(), 50);
    $$('#modal input').forEach(inp => inp.onkeydown = e => { if (e.key === 'Enter') $('#myes').click(); });
  });
}
/* долгая операция: окно с живым выводом, закрыть нельзя до конца */
async function longOp(title, action, args = {}) {
  openModal(`<div class="mh"><h2>${esc(title)}</h2></div><div class="mb"><div class="row"><span class="spin dark"></span><span id="lstat" style="color:var(--text2)">Выполняется… не закрывайте страницу</span></div>
    <div class="aptp" id="lprog"></div><div class="term small" id="lout"></div></div><div class="mf"><button class="btn" id="lclose" disabled>Закрыть</button></div>`);
  $('#modal').classList.add('wide');
  $('#modal').dataset.locked = '1';
  const out = $('#lout');
  // apt: «88 upgraded…», «Get:N …», «Unpacking …», «Setting up …» → ход работы над сырым выводом
  const apt = {total: 0, get: 0, unpack: 0, setup: 0};
  const prog = () => { if (!apt.total && !apt.get) return; const n = apt.total || '?';
    $('#lprog').innerHTML = [['Скачивание', apt.get], ['Распаковка', apt.unpack], ['Настройка', apt.setup]]
      .map(([l, v]) => `<span class="${apt.total && v >= apt.total ? 'done' : v ? 'run' : ''}">${l}: <b>${v} из ${n}</b></span>`).join(''); };
  const add = t => {
    let m;
    if ((m = t.match(/^(\d+) upgraded, (\d+) newly installed/))) apt.total = +m[1] + +m[2];
    else if (/^Get:\d+ /.test(t)) apt.get++;
    else if (/^Unpacking /.test(t)) apt.unpack++;
    else if (/^Setting up /.test(t)) apt.setup++;
    prog();
    out.insertAdjacentHTML('beforeend', `<div>${esc(t)}</div>`); out.scrollTop = out.scrollHeight; };

    const j = await fetch(`${path}?t=${TOKEN}`, {method: 'POST', body: JSON.stringify({...body, id})}).then(r => r.json());

}

async function addServer() {
  const v = await formBox('Добавить сервер', [
    {label: 'IP-адрес сервера', ph: '203.0.113.10'},
    {label: 'Порт SSH', type: 'number', value: '22'},
    {label: 'Пользователь', value: 'root', hint: 'обычно root; другой пользователь — с правами sudo (или понадобится пароль root)'},
    {label: 'Пароль', type: 'password', hint: 'нужен один раз: на сервер добавится ключ этого ПК, пароль нигде не сохраняется'},
    {label: 'Название', ph: 'по умолчанию — имя сервера (hostname)'},
  ], 'Подключить');
  if (!v) return;
  const body = {host: v[0], port: +v[1] || 22, user: (v[2] || 'root').trim() || 'root', password: v[3], name: v[4]};
  const send = async () => {
    openModal(`<div class="mh"><h2>Добавление сервера</h2></div><div class="mb"><div class="row"><span class="spin dark"></span><span class="muted">Подключение к ${esc(body.host)} под ${esc(body.user)}, создание ключа…</span></div></div>`);
    $('#modal').dataset.locked = '1';
    try { return await lpost('/app/server_add', body); }
    finally { delete $('#modal').dataset.locked; closeAll(); }
  };
  let r;
  for (let step = 0; step < 5; step++) {
    try { r = await send(); } catch (e) { toast(e.message, 'bad'); return; }
    if (r.hostkey_changed) {
      // ключ сервера сменился: обычно после переустановки; иначе — подмена, подключаться нельзя
      if (body.forget_hostkey) { toast('Ключ сервера по-прежнему не совпадает — подключение отменено', 'bad'); return; }
      if (!await confirmBox('Ключ сервера изменился', `Этот компьютер раньше подключался к ${esc(body.host)}, но сейчас сервер предъявляет другой ключ.\n\nТак бывает после переустановки сервера или ОС — тогда это нормально.\nЕсли сервер не переустанавливали — не продолжайте: соединение может быть перехвачено.`, 'Сервер переустановлен — подключиться', true)) return;
      body.forget_hostkey = true; continue;
    }
    if (r.need_root_password) {

      const p = await formBox('Нужен пароль root', [{label: 'Пароль root', type: 'password', hint: 'только для этого раза: через su на сервер добавится ключ этого ПК для root'}], 'Продолжить',

      if (!p || !p[0]) return;
      body.root_password = p[0]; continue;
    }
    if (r.need_root_key) {
      // сервер не пускает root даже по ключу
      if (!await confirmBox('Разрешить вход root по ключу?', `Сервер ${esc(body.host)} запрещает вход root по SSH даже по ключу, а kvnBox управляет сервером от root.\n\nЛаунчер разрешит вход root только по ключу (PermitRootLogin prohibit-password): по паролю root по-прежнему войти будет нельзя.`, 'Разрешить и подключить')) return;
      body.allow_root_key = true; continue;
    }
    break;
  }
  if (!r || !r.alias) return;
  await loadServers().catch(() => {});
  const s = SERVERS.find(x => x.Alias === r.alias);
  toast(`${r.name}: добавлен, вход по ключу работает`);
  if (!r.installed) { CHECK[r.alias] = {installed: false}; home(); if (s) installServer(s); return; }
  CHECK[r.alias] = undefined;

    try { msg(await apiOn(r.alias, 'ssh.set_auth', {mode: 'key'})); } catch (e) { toast(e.message, 'bad'); }
  }

}
async function installServer(s) {
  const v = await formBox(`Установка kvnBox: ${s.Name}`, [{label: 'Домен', ph: 'proxy.example.com', hint: 'A-запись домена должна указывать на IP сервера (' + s.Host + ')'}], 'Установить',
    'На сервер установится kvnBox: сайт-маскировка, VLESS, NaiveProxy и остальные компоненты. Это займёт 5–15 минут, окно можно не трогать. Нужен чистый Debian/Ubuntu.');
  if (!v) return;
  const dom = v[0].trim().toLowerCase();
  if (!/^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$/.test(dom)) { toast('Неверный домен', 'bad'); return; }
  openModal(`<div class="mh"><h2>Установка kvnBox на ${esc(s.Name)}</h2></div><div class="mb"><div class="row"><span class="spin dark"></span><span id="lstat" style="color:var(--text2)">Установка… 5–15 минут, не закрывайте страницу</span></div>
    <div class="steps" id="isteps"></div><div class="term small" id="lout" style="max-height:180px"></div></div><div class="mf"><button class="btn ghost danger" id="lstop">Прервать</button><button class="btn" id="lclose" disabled>Закрыть</button></div>`);
  $('#modal').dataset.locked = '1';
  const out = $('#lout'), steps = $('#isteps');
  let last = '', same = 0, stopped = false;
  const abort = async why => { if (stopped) return; stopped = true; $('#lstop').disabled = true; $('#lstat').textContent = why || 'Прерывание…';
    await lpost('/app/server_install_abort', {alias: s.Alias}).catch(() => {}); };
  $('#lstop').onclick = async () => { if (await confirmBox2('Прервать установку?', 'Установщик на сервере будет остановлен. Начать заново можно позже.')) abort('Прерывание…'); };
  const add = t => {
    const m = t.match(/^\[(\.\.|ok|!!|FAIL)\]\s*(.*)$/);
    if (m) {
      const [, k, name] = m; const last = steps.lastElementChild;
      if (k !== '..' && last && last.dataset.run === '1') last.remove();
      const ico = k === '..' ? '<span class="spin dark" style="width:12px;height:12px"></span>' : k === 'ok' ? `<span style="color:var(--green)">${ic('check')}</span>` : k === '!!' ? `<span style="color:var(--yellow)">${ic('alert')}</span>` : `<span style="color:var(--red)">${ic('x')}</span>`;
      steps.insertAdjacentHTML('beforeend', `<div class="stp" data-run="${k === '..' ? 1 : 0}">${ico}<span>${esc(name)}</span></div>`);
      return;
    }
    if (t === last) { if (++same >= 20) abort('Установщик повторяет одну и ту же строку — остановлен.'); return; }
    last = t; same = 0;
    out.insertAdjacentHTML('beforeend', `<div>${esc(t)}</div>`); out.scrollTop = out.scrollHeight;
  };
  try {
    await lpost('/app/server_install', {alias: s.Alias, domain: dom}, add);
    $('#lstat').innerHTML = `<b style="color:var(--green)">✓ kvnBox установлен на ${esc(s.Name)}</b>`;
    CHECK[s.Alias] = undefined;
  } catch (e) { $('#lstat').innerHTML = `<b style="color:var(--red)">✗ ${esc(e.message)}</b>`; }
  finally {
    $('.spin.dark')?.remove(); delete $('#modal').dataset.locked; $('#lstop')?.remove();
    $('#lclose').disabled = false; $('#lclose').onclick = () => { closeAll(); delete LINK[s.Alias]; home(true); };
  }
}

let PICK = '', CORE = '';
async function addUser(existing) {
  openModal(`<div class="mh"><h2>${existing ? `Новый протокол для ${esc(existing)}` : 'Новый пользователь'}</h2></div><div class="mb"><div class="sk" style="height:260px"></div></div>`);

  try { slots = await api('users.slots'); } catch (e) { toast(e.message, 'bad'); closeAll(); return; }
  const have = existing ? (USERS.find(u => u.name === existing)?.connections || []).map(c => c.slot) : [];
  if (!PICK || !slots.find(s => s.slot === PICK && s.available && !have.includes(s.slot))) PICK = (slots.find(s => s.available && !have.includes(s.slot)) || {}).slot || '';
  const draw = () => {
    const cur = slots.find(s => s.slot === PICK);
    if (cur && !cur.cores.includes(CORE)) CORE = cur.cores[0] || '';
    openModal(`<div class="mh"><h2>${existing ? `Новый протокол для ${esc(existing)}` : 'Новый пользователь'}</h2><span style="flex:1"></span><button class="icon-btn" id="mx">${ic('x')}</button></div>

      <div class="protos">${slots.map(s => { const v = PROTOS[s.slot]; const dis = !s.available || have.includes(s.slot);
        return `<div class="pc ${PICK === s.slot ? 'on' : ''} ${dis ? 'dis' : ''}" data-p="${s.slot}" title="${esc(have.includes(s.slot) ? 'уже есть у пользователя' : s.reason)}"><span class="pi" style="background:${v.c}">${v.n.replace('VLESS ', '').slice(0, 2).toUpperCase()}</span><div><b>${v.n}</b><small>${esc(have.includes(s.slot) ? 'уже есть' : s.available ? v.d : s.reason)}</small></div></div>`; }).join('')}</div></div>
      ${cur && cur.cores.length > 1 ? `<div class="row"><span style="font-size:13px;color:var(--text2)">Ядро</span><div class="seg">${cur.cores.map(c => `<button class="${CORE === c ? 'on' : ''}" data-c="${c}">${c === 'singbox' ? 'sing-box' : 'Xray'}</button>`).join('')}</div></div>` : ''}
    </div><div class="mf"><button class="btn" id="mno">Отмена</button><button class="btn primary" id="mok" ${PICK ? '' : 'disabled'}>${ic('plus')} ${existing ? 'Добавить протокол' : 'Создать'}</button></div>`);
    $('#mx').onclick = $('#mno').onclick = closeAll;
    $$('.pc:not(.dis)').forEach(c => c.onclick = () => { PICK = c.dataset.p; draw(); });
    $$('.seg button').forEach(b => b.onclick = () => { CORE = b.dataset.c; draw(); });
    $('#nn')?.focus();
    $('#mok').onclick = e => { const name = existing || $('#nn').value.trim().toLowerCase();
      if (!/^[a-z0-9_-]{1,32}$/.test(name)) { $('#nn').style.borderColor = 'var(--red)'; toast('Имя: латиница, цифры, «-» и «_»', 'bad'); return; }
      busy(e.currentTarget, async () => { await api('users.add', {name, slot: PICK, core: CORE}); closeAll(); toast(`${name}: добавлен ${PROTOS[PICK].n}`);
        USERS = await api('users.list'); USERCOUNT = USERS.length; renderNav(); if (PAGE === 'users') fillUsers(); openUser(name); }); };
  };
  draw();
}

function modCard(m) {
  const [s, c] = MODC[m.id]; const st = m.installed ? m.state : 'not_installed';
  const sw = ['xray', 'mieru', 'awg'].includes(m.id) && (m.installed || m.id === 'awg');
  const locked = sw && m.enabled && m.users_on > 0;
  const btn = (a, t, i, cls = '') => `<button class="btn ${cls}" data-m="${m.id}" data-a="${a}">${i ? ic(i) : ''} ${t}</button>`;
  const acts = [];
  if (!m.installed && ['xray', 'mieru', 'netbird'].includes(m.id)) acts.push(btn('install', 'Установить', 'dl', 'primary'));
  if (m.installed && m.id !== 'netbird') acts.push(btn('update', 'Обновление', 'up'));
  if (m.id === 'awg' && m.update_available) acts.push(btn('update', `Обновить до ${esc(m.target_version)}`, 'up', 'primary'));
  if (m.installed && ['singbox', 'caddy', 'xray', 'mieru', 'awg'].includes(m.id) && st === 'active') acts.push(btn('restart', 'Перезапуск', 'refresh', 'ghost'));
  if (m.id === 'mieru' && m.installed) acts.push(btn('port', 'Порт', '', 'ghost'));
  if (m.id === 'awg' && m.enabled) acts.push(btn('port', 'Порт', '', 'ghost'), btn('regen', 'Новая маскировка', '', 'ghost'));
  if (m.id === 'netbird' && m.installed) acts.push(btn('url', 'Management URL', '', 'ghost'), btn('key', 'Setup Key', '', 'ghost'), btn('up', 'Подключить', '', 'ghost'), btn('nbstat', 'Статус', '', 'ghost'), btn('nbupd', 'Обновить', 'up', 'ghost'));
  if (m.installed && ['xray', 'mieru', 'netbird'].includes(m.id)) acts.push(btn('uninstall', 'Удалить', 'trash', 'ghost danger'));
  if (m.installed) acts.push(`<button class="btn ghost" onclick="LOGUNIT='${m.unit}';go('logs')">${ic('log')} Журнал</button>`);
  const kv = [];
  if (m.version) kv.push(['Версия', esc(m.version)]);
  if (m.id === 'netbird' && m.installed) {
    kv.push(['Management URL', m.management_url ? esc(m.management_url) : 'не задан (облако NetBird)']);
    kv.push(['Setup Key', m.has_setup_key ? '<span style="color:var(--green)">задан</span>' : '<span style="color:var(--yellow)">не задан</span>']);
    if (m.ip) kv.push(['IP в сети NetBird', esc(m.ip)]);
  }
  return `<div class="card mod"><div class="head"><span class="lg" style="background:${c}">${s}</span><div style="flex:1;min-width:0"><h3>${esc(m.name)}</h3><span class="pill ${stateCls(st)}"><span class="dot ${stateCls(st)}"></span>${stateText(st)}</span></div>
    ${sw ? `<button class="sw ${m.enabled ? 'on' : ''}" data-m="${m.id}" data-a="toggle" ${locked ? 'disabled' : ''} title="${locked ? `Нельзя выключить: включённые подключения у ${m.users_on} ${plural(m.users_on, 'пользователя', 'пользователей', 'пользователей')}` : m.enabled ? 'Выключить' : 'Включить'}"></button>` : ''}</div>
    <div class="muted">${esc(m.note || '')}</div>
    ${kv.length ? `<div class="kv">${kv.map(([a, b]) => `<span>${a}: <b>${b}</b></span>`).join('')}</div>` : ''}
    <div class="foot">${acts.join('')}</div></div>`;
}
async function modAction(btn, id, a, m) {
  try {
    if (a === 'toggle') {
      if (m.enabled && !await confirmBox(`Выключить ${m.name}?`, 'Подключения пользователей на нём перестанут работать до включения.', 'Выключить', true)) return;
      if (id === 'awg' && !m.enabled && !m.installed) { await longOp('Включение AmneziaWG (сборка 1–2 минуты)', 'modules.set_enabled', {id, enabled: true}); return modules(); }
      return busy(btn, async () => { msg(await api('modules.set_enabled', {id, enabled: !m.enabled})); modules(); });
    }
    if (a === 'install') { await longOp(`Установка ${m.name}`, 'modules.install', {id}); return modules(); }
    if (a === 'uninstall') { if (await confirmBox(`Удалить ${m.name}?`, 'Подключения пользователей на нём будут удалены или перестанут работать.', 'Удалить', true)) { await longOp(`Удаление ${m.name}`, 'modules.uninstall', {id}); modules(); } return; }
    if (a === 'restart') return busy(btn, async () => msg(await api('service.restart', {unit: m.unit})));
    if (a === 'update') {
      if (id === 'awg' && m.update_available) { await longOp('Обновление AmneziaWG', 'modules.update', {id}); return modules(); }
      const l = await busy(btn, () => api('modules.latest', {id})); if (!l) return;
      const same = m.version && l.latest.replace(/^v/, '') === m.version.replace(/^v/, '');
      if (!await confirmBox(same ? `${m.name}: последняя версия` : `Обновить ${m.name}?`, same ? `Установлена ${m.version}. Переустановить её?` : `Сейчас ${m.version || '—'}, доступна ${l.latest}.${id === 'caddy' ? '\nСборка Caddy займёт до 5 минут.' : ''}`, same ? 'Переустановить' : 'Обновить')) return;
      await longOp(`Обновление ${m.name}`, 'modules.update', {id, version: l.latest}); return modules();
    }
    if (a === 'port') { const v = await formBox(`${m.name}: порт`, [{label: 'Порт', value: String(m.port || ''), type: 'number'}], 'Сменить', id === 'awg' ? 'После смены порта клиентам AmneziaWG нужны новые конфиги.' : 'После смены порта клиентам Mieru нужны новые ссылки.'); if (!v) return;
      return busy(btn, async () => { msg(await api(id === 'awg' ? 'awg.set_port' : 'mieru.set_port', {port: +v[0]})); modules(); }); }
    if (a === 'regen') { if (await confirmBox('Новая маскировка AmneziaWG?', 'Новые ключ сервера и параметры. Все выданные конфиги AmneziaWG перестанут работать — выдайте их заново.', 'Сменить', true)) busy(btn, async () => msg(await api('awg.regenerate'))); return; }
    if (a === 'key') { const v = await formBox('NetBird: Setup Key', [{label: 'Setup Key', ph: 'XXXXXXXX-XXXX-…'}]); if (v) busy(btn, async () => { msg(await api('netbird.set_setup_key', {key: v[0]})); modules(); }); return; }
    if (a === 'url') { const v = await formBox('NetBird: Management URL', [{label: 'Адрес', value: m.management_url || '', ph: 'https://netbird.example.com'}]); if (v) busy(btn, async () => { msg(await api('netbird.set_management_url', {url: v[0]})); modules(); }); return; }
    if (a === 'up') { await longOp('Подключение NetBird', 'netbird.up'); return modules(); }
    if (a === 'nbupd') { await longOp('Обновление NetBird', 'modules.update', {id: 'netbird'}); return modules(); }
    if (a === 'nbstat') { const d = await busy(btn, () => api('netbird.status')); if (d) openModal(`<div class="mh"><h2>NetBird: статус</h2></div><div class="mb"><div class="term small">${esc(d.detail || d.state)}</div></div><div class="mf"><button class="btn" onclick="closeAll()">Закрыть</button></div>`); }
  } catch (e) { toast(e.message, 'bad'); }
}

let LOGUNIT = 'caddy';
async function logs() {
  let units;
  $('#page').innerHTML = `<div class="card"><div class="sk" style="height:300px"></div></div>`;
  try { units = await api('logs.units'); } catch (e) { $('#page').innerHTML = errorCard(e, 'logs()'); return; }
  if (!units.some(u => u.unit === LOGUNIT)) LOGUNIT = units[0]?.unit || 'caddy';
  $('#page').innerHTML = `<div class="card" style="padding:0"><div class="tabs">${units.map(u => `<button class="${LOGUNIT === u.unit ? 'on' : ''}" data-l="${u.unit}">${esc(u.label)}</button>`).join('')}</div>
    <div style="padding:14px;display:grid;gap:12px"><div class="row wrap"><div class="search" style="min-width:0;flex:1">${ic('search')}<input id="lq" placeholder="Фильтр строк"></div>
      <span class="pill ok" id="lst"><span class="dot ok"></span>в реальном времени</span><button class="btn ghost" id="lpause">Пауза</button><button class="btn ghost" id="ldl">${ic('dl')} Скачать</button></div>
    <div class="term" id="term"></div></div></div>`;
  $$('[data-l]').forEach(b => b.onclick = () => { LOGUNIT = b.dataset.l; go('logs'); });
  const term = $('#term'); const all = []; let paused = false;
  const show = l => { if ($('#lq').value && !l.toLowerCase().includes($('#lq').value.toLowerCase())) return;
    const dep = /is deprecated, not recommended/.test(l);
    const cls = dep ? 'd' : /error|fail|fatal|panic|ошибк/i.test(l) ? 'e' : /warn/i.test(l) ? 'w' : '';
    // journald: «2026-11-08T09:23:23+00:00 host unit[pid]: текст»; файлы (fail2ban, NetBird): «2026-11-08 17:14:59,924 текст»
    const j = l.match(/^\d{4}-\d\d-\d\dT(\d\d:\d\d:\d\d)\S*\s+\S+\s+[^\s:]+:\s?(.*)$/);
    const f = !j && l.match(/^\d{4}-\d\d-\d\d[T ](\d\d:\d\d:\d\d)\S*\s+(.*)$/);
    const m = j || f;
    const note = dep ? ' <span class="ts">· предупреждение Xray, не ошибка</span>' : '';
    term.insertAdjacentHTML('beforeend', m ? `<div class="${cls}"><span class="ts">${esc(m[1])}</span> ${esc(m[2])}${note}</div>` : `<div class="${cls}">${esc(l)}${note}</div>`);
    if (!paused) term.scrollTop = term.scrollHeight; };
  $('#lq').oninput = () => { term.innerHTML = ''; all.forEach(show); };
  $('#lpause').onclick = e => { paused = !paused; e.target.textContent = paused ? 'Продолжить' : 'Пауза'; $('#lst').className = 'pill ' + (paused ? '' : 'ok'); };
  $('#ldl').onclick = () => download(`${LOGUNIT}.log`, all.join('\n'), 'text/plain');
  const c = call('logs.follow', {unit: LOGUNIT, lines: 300}, l => { all.push(l); if (all.length > 5000) all.shift(); show(l); });
  STOP = () => api('api.cancel', {target: c.id}).catch(() => {});
  c.promise.catch(e => { if (PAGE === 'logs') term.insertAdjacentHTML('beforeend', `<div class="e">${esc(e.message)}</div>`); });
}

const keepPc = (k, v) => { if (!PCRES || PCRES.srv !== SRV) PCRES = {srv: SRV}; PCRES[k] = v; };
const pcRes = k => PCRES && PCRES.srv === SRV ? PCRES[k] : null;
const spinTo = (id, t) => $('#' + id).innerHTML = `<div class="row"><span class="spin dark"></span><span class="muted">${t}</span></div>`;
const mbitOf = (b, t0) => Math.round(b * 8 / ((performance.now() - t0) / 1000) / 1e5) / 10;

/* HTTPS через 443: страница сама качает с сервера и отправляет на него — как VPN-клиент */
function diagHttps() {
  $('#dbody').innerHTML = `<div class="row wrap"><div style="flex:1"><div class="dtitle">Скорость ПК ↔ сервер через HTTPS (порт 443)</div>
      <div class="muted">Как работают VPN-клиенты: шифрование, тот же маршрут, что у сайта. Около 20 секунд.</div></div>
      <button class="btn primary" id="dHB">${ic('refresh')} Замерить</button></div><div id="dHR" style="margin-top:16px"><span class="muted">ещё не замеряли</span></div>`;
  const show = r => { $('#dHR').innerHTML = `<div class="stres">${nCard(r.down, 'Мбит/с', '↓ Загрузка (сервер → ПК)')}${nCard(r.up, 'Мбит/с', '↑ Отдача (ПК → сервер)')}
      ${r.ping != null ? nCard(r.ping, 'мс', 'Задержка (ответ сервера)') + nCard(r.jitter, 'мс', 'Разброс задержки') : nCard('—', '', 'Задержка: обновите панель на сервере')}</div>`; };
  if (pcRes('https')) show(pcRes('https'));
  $('#dHB').onclick = e => busy(e.currentTarget, async () => {
    spinTo('dHR', 'Подготовка сервера замера…');
    try {
      const {url} = await api('diag.https_start');
      try {
        spinTo('dHR', 'Задержка…');
        const times = [];
        for (let i = 0; i < 11; i++) {
          const t0 = performance.now(); const r = await fetch(url + '/ping?i=' + i, {cache: 'no-store'});
          if (r.status === 404) break; if (i) times.push(performance.now() - t0);   // первый — с установкой соединения
        }
        const ping = times.length ? Math.round(times.reduce((a, b) => a + b, 0) / times.length) : null;
        const jitter = times.length > 1 ? Math.round(times.slice(1).reduce((a, x, i) => a + Math.abs(x - times[i]), 0) / (times.length - 1)) : null;
        spinTo('dHR', 'Загрузка: сервер → ПК…');
        let got = 0; const ctl = new AbortController(); const t0 = performance.now(); const tm = setTimeout(() => ctl.abort(), 8000);
        try { const r = await fetch(url + '/down?mb=1000', {signal: ctl.signal, cache: 'no-store'}); if (!r.ok) throw new Error(`сервер замера ответил ${r.status}`);
          const rd = r.body.getReader(); for (;;) { const {done, value} = await rd.read(); if (done) break; got += value.length; } }
        catch (err) { if (err.name !== 'AbortError') throw new Error('HTTPS: ' + err.message); }
        clearTimeout(tm); const down = mbitOf(got, t0);
        spinTo('dHR', 'Отдача: ПК → сервер…');
        const blob = new Uint8Array(2 * 1024 * 1024); for (let i = 0; i < blob.length; i += 65536) crypto.getRandomValues(blob.subarray(i, i + 65536));
        let sent = 0; const t1 = performance.now();
        while (performance.now() - t1 < 8000) { const r = await fetch(url + '/up', {method: 'POST', body: blob, headers: {'Content-Type': 'text/plain'}, cache: 'no-store'}); if (!r.ok) throw new Error(`сервер замера ответил ${r.status}`); sent += blob.length; }
        const res = {down, up: mbitOf(sent, t1), ping, jitter}; keepPc('https', res); show(res);
      } finally { api('diag.https_stop').catch(() => {}); }
    } catch (err) { $('#dHR').innerHTML = `<span style="color:var(--red)">${esc(err.message)}</span>`; throw err; }
  });
}

/* iperf3 через 5201: лаунчер запускает iperf3 на ПК (ставит при первом замере) */
function diagIperf() {
  const s = SERVERS.find(x => x.Alias === SRV);
  $('#dbody').innerHTML = `<div class="row wrap"><div style="flex:1"><div class="dtitle">Скорость ПК ↔ сервер через iperf3 (порт 5201)</div>
      <div class="muted">Чистая скорость канала, повторные передачи TCP и UDP-замер (потери, джиттер — важно для AmneziaWG). Порт открывается только на время замера. Около 30 секунд. Задержка — на вкладке HTTPS.</div></div>
      <button class="btn primary" id="dIB">${ic('refresh')} Замерить</button></div><div id="dIR" style="margin-top:16px"><span class="muted">ещё не замеряли</span></div>
    <div class="muted" style="margin-top:14px;font-size:12.5px">Вручную (iperf3 на ПК, пока идёт замер): <code>iperf3 -c ${esc(s ? s.Host : 'IP')} -p 5201 -R</code> — сервер → ПК; без <code>-R</code> — ПК → сервер.</div>`;
  const show = r => { const v = x => x == null ? '—' : x;
    $('#dIR').innerHTML = `<div class="stres">${nCard(r.down, 'Мбит/с', '↓ Загрузка (сервер → ПК)')}${nCard(r.up, 'Мбит/с', '↑ Отдача (ПК → сервер)')}${nCard(v(r.retr), '', 'Повторные передачи')}
      ${nCard(v(r.loss), r.loss == null ? '' : '%', 'UDP: потери (при 80% скорости загрузки)')}${nCard(v(r.ujit), r.ujit == null ? '' : 'мс', 'UDP: джиттер')}</div>`; };
  if (pcRes('iperf')) show(pcRes('iperf'));
  let IPORT = 5201;
  const local = async (dir, rate = 0) => {
    const j = await fetch(`/app/iperf?t=${TOKEN}&s=${encodeURIComponent(SRV)}&dir=${dir}&port=${IPORT}&rate=${rate}`, {method: 'POST'}).then(r => r.json());
    if (!j.ok) { const e = new Error(j.error || 'iperf3: ошибка'); e.needInstall = j.need_install; throw e; }
    if (j.data.error) throw new Error('iperf3: ' + j.data.error);
    return j.data;
  };
  const mbps = x => Math.round(((x || {}).bits_per_second || 0) / 1e5) / 10;
  const run = async () => {
    spinTo('dIR', 'Запуск iperf3 на сервере…');
    const srv = await api('diag.iperf_start'); IPORT = srv.port || 5201;
    try {
      spinTo('dIR', 'Загрузка: сервер → ПК…'); const d = await local('down');
      spinTo('dIR', 'Отдача: ПК → сервер…'); const u = await local('up');
      spinTo('dIR', 'UDP: потери и джиттер…'); let ud = null;
      for (let i = 0; i < 2 && !ud; i++) { await new Promise(r => setTimeout(r, 1500)); try { ud = await local('udp', Math.max(2, Math.round(mbps(d.end?.sum_received) * 0.8))); } catch (_) {} }   // сервер iperf3 освобождается не сразу
      const retrD = d.end?.sum_sent?.retransmits, retrU = u.end?.sum_sent?.retransmits;
      const res = {down: mbps(d.end?.sum_received), up: mbps(u.end?.sum_received),
        retr: retrD != null || retrU != null ? (retrD || 0) + (retrU || 0) : null,
        loss: ud?.end?.sum?.lost_percent != null ? Math.round(ud.end.sum.lost_percent * 10) / 10 : null,
        ujit: ud?.end?.sum?.jitter_ms != null ? Math.round(ud.end.sum.jitter_ms * 10) / 10 : null};
      keepPc('iperf', res); show(res);
    } finally { api('diag.iperf_stop').catch(() => {}); }
  };
  $('#dIB').onclick = e => busy(e.currentTarget, async () => {
    try { await run(); }
    catch (err) {
      if (!err.needInstall) { $('#dIR').innerHTML = `<span style="color:var(--red)">${esc(err.message)}</span>`; throw err; }
      $('#dIR').innerHTML = `<div class="found"><span class="dot warn"></span><div style="flex:1"><b>На этом ПК нет iperf3</b><div class="muted">Лаунчер скачает iperf3 3.22 для Windows (около 1 МБ, github.com/ar51an/iperf3-win-builds), сверит контрольную сумму и положит в свою папку.</div></div><button class="btn primary" id="dInst">${ic('dl')} Установить iperf3</button></div>`;
      $('#dInst').onclick = ev => busy(ev.currentTarget, async () => {
        const j = await fetch(`/app/iperf_install?t=${TOKEN}`, {method: 'POST'}).then(r => r.json());
        if (!j.ok) throw new Error(j.error || 'Не удалось установить iperf3');
        toast('iperf3 установлен'); await run();
      });
    }
  });
}

/* ═══ тема, запуск ═══ */
// фоны тем в HSL: ползунок сдвигает яркость фонов/карточек/линий (текст — из CSS темы)
const THEMES = {
  light: {name: 'Светлая', ic: 'sun', v: {bg: [220, 33, 96], bg2: [0, 0, 100], card: [0, 0, 100], card2: [220, 50, 98], line: [219, 33, 92], line2: [218, 28, 87]}},
  gray: {name: 'Серая', ic: 'moon', v: {bg: [220, 7, 23], bg2: [220, 7, 20], card: [220, 7, 27], card2: [220, 7, 30], line: [220, 7, 35], line2: [220, 7, 41]}},
  dark: {name: 'Тёмная', ic: 'moon', v: {bg: [225, 49, 8], bg2: [224, 46, 11], card: [223, 46, 14], card2: [223, 45, 17], line: [221, 40, 22], line2: [222, 37, 27]}},
};
const hsl = (c, d = 0) => `hsl(${c[0]} ${c[1]}% ${Math.max(0, Math.min(100, c[2] + d))}%)`;
function themeState() {
  let t = localStorage.getItem('kvn-theme');
  if (!THEMES[t]) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  return {t, d: +localStorage.getItem('kvn-tone-' + t) || 0};
}
function applyTheme() {
  const {t, d} = themeState(), h = document.documentElement;
  h.dataset.theme = t;
  for (const [k, c] of Object.entries(THEMES[t].v)) h.style.setProperty('--' + k, hsl(c, d));
  $('#themeBtn').innerHTML = ic(THEMES[t].ic);
  renderThemePop();
}
function renderThemePop() {
  const {t, d} = themeState();
  $('#themePop').innerHTML = `<div class="tl">Оформление</div>
    <div class="thm">${Object.entries(THEMES).map(([k, x]) => `<button data-t="${k}" class="${k === t ? 'on' : ''}" title="${x.name}" aria-label="${x.name}"><i style="background:linear-gradient(135deg,${hsl(x.v.bg)} 50%,${hsl(x.v.card)} 50%)"></i></button>`).join('')}</div>
    <div class="tl">Яркость фона</div>
    <div class="thm-sl"><span>−</span><input type="range" min="-10" max="10" step="1" value="${d}" id="toneSl"><span>+</span><button class="rs" id="toneRs" title="Сбросить яркость" aria-label="Сбросить яркость"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button></div>`;
  $('#themePop').querySelectorAll('[data-t]').forEach(b => b.onclick = () => { localStorage.setItem('kvn-theme', b.dataset.t); applyTheme(); });
  $('#toneSl').oninput = e => { localStorage.setItem('kvn-tone-' + t, e.target.value); const v = +e.target.value; for (const [k, c] of Object.entries(THEMES[t].v)) document.documentElement.style.setProperty('--' + k, hsl(c, v)); };
  $('#toneRs').onclick = () => { localStorage.removeItem('kvn-tone-' + t); applyTheme(); };
}
applyTheme();
$('#themeBtn').onclick = e => { e.stopPropagation(); $('#themePop').classList.toggle('open'); };
$('#themePop').onclick = e => e.stopPropagation();
document.addEventListener('click', () => $('#themePop').classList.remove('open'));
$('#srvBtn').onclick = e => { e.stopPropagation(); $('#srvMenu').classList.toggle('open'); };
document.addEventListener('click', () => $('#srvMenu').classList.remove('open'));
$('#burger').onclick = () => $('#aside').classList.toggle('open');
$('#refresh').onclick = async () => { await loadServers(PAGE === 'home').catch(() => {}); if (PAGE === 'home') { Object.keys(CHECK).forEach(k => delete CHECK[k]); home(); } else if (READY) { ping(); go(PAGE); } else connect(); };
events();
renderNav();
loadServers().then(() => go('home'), e => { $('#page').innerHTML = errorCard(e, 'location.reload()'); });
setInterval(() => { if (READY && !document.hidden) ping(); }, 30000);

</script>
