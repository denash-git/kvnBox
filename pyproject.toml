[project]
name = "kvnbox"
version = "0.1.0"
description = "kvnBox — панель управления прокси-сервером (Caddy + NaiveProxy, sing-box, Mieru)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9,<3",
    "aiogram>=3.13,<4",
]

[project.scripts]
kvnbox = "kvnbox.__main__:main"
menu = "kvnbox.cli.main:menu_main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kvnbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "posix: тест требует Linux (fcntl, права файлов)",
    "system: read-only проверки на настоящей системе (стенд)",
]

[tool.coverage.run]
source = ["kvnbox"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях

[tool.ruff.lint.per-file-ignores]
# тексты сообщений бота — одной строкой, как пользователь их видит
"src/kvnbox/bot/handlers/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
platform = "linux"
mypy_path = "src"
packages = ["kvnbox"]
strict = true
plugins = ["pydantic.mypy"]
